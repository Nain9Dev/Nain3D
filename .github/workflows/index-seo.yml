name: Entry page content

on:
  push:
    branches: ["main"]
    paths:
      - "Nain3D.Client/index.html"
      - "scripts/index-seo.test.mjs"
      - ".github/workflows/index-seo.yml"
  pull_request:
    paths:
      - "Nain3D.Client/index.html"
      - "scripts/index-seo.test.mjs"
      - ".github/workflows/index-seo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-seo:
    name: Entry page static content
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/index-seo.test.mjs
